name: Build and push Docker image

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest

    env:
      IMAGE_NAME: fleetctrl-hub
      API_IMAGE_NAME: fleetctrl-api
      # GHCR
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' ./package.json)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          FULL_VERSION="${RELEASE_TAG#v}"

          if [ -z "$FULL_VERSION" ]; then
            FULL_VERSION="$VERSION"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"

      - name: Compute image coordinates (GHCR)
        id: coords
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"

          echo "GHCR_IMAGE=${{ env.GHCR_REGISTRY }}/$OWNER_LC/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "GHCR_API_IMAGE=${{ env.GHCR_REGISTRY }}/$OWNER_LC/${{ env.API_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Build and push app (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.FULL_VERSION }}
            ${{ env.GHCR_IMAGE }}:latest
          # optional improved tags/labels:
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FULL_VERSION }}

      # Device API, Better Auth and admin API; also runs db-migrate and the Convex importer.
      # (fleetctrl-convex-migration is no longer built: v2 installs keep their pinned tag for the export.)
      - name: Build and push API image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.GHCR_API_IMAGE }}:${{ env.FULL_VERSION }}
            ${{ env.GHCR_API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FULL_VERSION }}
