name: Build and push Docker image

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest

    env:
      IMAGE_NAME: fleetctrl-hub
      MIGRATION_IMAGE_NAME: fleetctrl-convex-migration
      # GHCR
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version from release tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # workflow_dispatch: use the selected ref if it is a tag
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No release tag found. Publish a release or run the workflow on a tag."
            exit 1
          fi

          echo "FULL_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Compute image coordinates (GHCR)
        id: coords
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"

          echo "GHCR_IMAGE=${{ env.GHCR_REGISTRY }}/$OWNER_LC/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "GHCR_MIGRATION_IMAGE=${{ env.GHCR_REGISTRY }}/$OWNER_LC/${{ env.MIGRATION_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Build and push app (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.FULL_VERSION }}
            ${{ env.GHCR_IMAGE }}:latest
          # optional improved tags/labels:
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FULL_VERSION }}

      - name: Build and push convex-migration image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.convex-migration
          push: true
          tags: |
            ${{ env.GHCR_MIGRATION_IMAGE }}:${{ env.FULL_VERSION }}
            ${{ env.GHCR_MIGRATION_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.FULL_VERSION }}
