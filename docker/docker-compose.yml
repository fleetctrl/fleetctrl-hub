name: fleetctrl
services:
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs-data}:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_SERVER_DOMAINS=${RUSTFS_SERVER_DOMAINS:-localhost,rustfs}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
    command:
      - "--address"
      - ":9000"
      - "--console-enable"
      - "--server-domains"
      - "${RUSTFS_SERVER_DOMAINS:-localhost,rustfs}"
      - "--access-key"
      - "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      - "--secret-key"
      - "${RUSTFS_SECRET_KEY:-rustfsadmin}"
      - "/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init container: creates the bucket that holds installers, scripts and client updates.
  rustfs-init:
    image: amazon/aws-cli:latest
    environment:
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL_S3=http://rustfs:9000
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
      - S3_BUCKET=${S3_BUCKET:-fleetctrl-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws configure set default.s3.addressing_style path
        until aws s3api list-buckets > /dev/null; do
          echo "Waiting for RustFS S3 API..."
          sleep 2
        done
        aws s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$S3_BUCKET" || exit 1
        echo "Bucket $$S3_BUCKET ready."
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      # Upgrades from v2 keep the existing superuser (convex) and data volume; see manage.sh migrate-from-convex.
      POSTGRES_USER: ${POSTGRES_USER:-fleetctrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-fleetctrl}
    volumes:
      - ${POSTGRES_DATA_DIR:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetctrl} -d ${POSTGRES_DB:-fleetctrl}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies the SQL migrations in drizzle/ before the API starts.
  db-migrate:
    build:
      context: ../
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-fleetctrl-api:local}
    command: ["node", "migrate.js"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-fleetctrl}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/fleetctrl}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    container_name: ${API_CONTAINER_NAME:-fleetctrl-api}
    build:
      context: ../
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-fleetctrl-api:local}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-fleetctrl}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/fleetctrl}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_BUCKET=${S3_BUCKET:-fleetctrl-files}
      - S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - S3_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      # Device API: DPoP proofs and access tokens are bound to API_URL and JWT_SECRET. Never change them on an existing install.
      - API_URL=${API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SITE_URL=${SITE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  hub:
    container_name: ${HUB_CONTAINER_NAME:-fleetctrl-hub}
    build:
      context: ../
      dockerfile: Dockerfile
      target: runner
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      - SITE_URL=${SITE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_ALLOW_REGISTRATION=${NEXT_PUBLIC_ALLOW_REGISTRATION}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    container_name: ${PROXY_CONTAINER_NAME:-fleetctrl-proxy}
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hub
      - api

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rustfs-data:
